<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aramıza Hoş Geldiniz!</title>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f9fafb; color: #111827; margin: 0; padding: 40px 0; }
        .container { max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); text-align: center; }
        h1 { font-size: 24px; font-weight: 700; margin-bottom: 16px; color: #111827; }
        p { font-size: 16px; color: #6b7280; line-height: 1.5; margin-bottom: 32px; }
        .footer { margin-top: 40px; font-size: 14px; color: #9ca3af; border-top: 1px solid #f3f4f6; padding-top: 24px; }
        .unsubscribe { color: #6b7280; text-decoration: underline; }
        /* Fallback: .logo class sadece non-Outlook istemciler için */
        .logo-wrapper { margin: 0 auto 24px auto; width: 64px; }
    </style>
</head>
<body>
    <div class="container">

        <!--
            TALEİP 5 — Emoji Hizalama Düzeltmesi (Faz 1 / 1.2.x)
            Eski: <div class="logo">🎉</div>  — inline-flex + line-height:64px, Outlook/bazı istemcilerde dikey kayma yapıyor.
            Yeni: table-based layout — tüm büyük e-posta istemcilerinde (Gmail, Outlook, Apple Mail) tutarlı hizalama.
        -->

        <!-- Outlook MSO için conditional table -->
        <!--[if mso]>
        <table role="presentation" width="64" height="64" cellpadding="0" cellspacing="0" style="margin:0 auto 24px auto;">
          <tr>
            <td width="64" height="64" align="center" valign="middle"
                style="background-color:#10b981; border-radius:32px; width:64px; height:64px;">
        <![endif]-->

        <!-- Non-MSO istemciler (Gmail, Apple Mail, mobil) -->
        <!--[if !mso]><!-->
        <div class="logo-wrapper">
        <!--<![endif]-->

        <table role="presentation" width="64" height="64" cellpadding="0" cellspacing="0"
               style="margin:0 auto; border-collapse:collapse;">
          <tr>
            <td width="64" height="64" align="center" valign="middle"
                style="width:64px; height:64px; background-color:#10b981; border-radius:50%;
                       text-align:center; vertical-align:middle; font-size:28px; line-height:1;">
              🎉
            </td>
          </tr>
        </table>

        <!--[if !mso]><!-->
        </div>
        <!--<![endif]-->

        <!--[if mso]>
            </td>
          </tr>
        </table>
        <![endif]-->

        <h1>Aramıza Hoş Geldiniz{{Name}}!</h1>
        <p>Aboneliğiniz başarıyla onaylandı. Artık en son güncellemeleri, özel içerikleri ve duyuruları ilk siz öğreneceksiniz.</p>
        <p>Sizinle harika içerikler paylaşmak için sabırsızlanıyoruz.</p>
        <div class="footer">
            E-bülten almak istemiyorsanız <a href="{{UnsubscribeUrl}}" class="unsubscribe">buraya tıklayarak abonelikten ayrılabilirsiniz.</a>
        </div>
    </div>
</body>
</html>
