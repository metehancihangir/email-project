<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Bülten Aboneliğinizi Onaylayın</title>
</head>
<body style="font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #f4f7f6; color: #111827; margin: 0; padding: 40px 10px;">
    <table border="0" cellpadding="0" cellspacing="0" width="100%" style="table-layout: fixed;">
        <tr>
            <td align="center" style="padding: 0;">
                <table border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 580px; background-color: #ffffff; border-radius: 16px; border: 1px solid #e5e7eb; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05); overflow: hidden;">
                    <!-- Header Icon Row -->
                    <tr>
                        <td align="center" valign="middle" style="padding: 40px 30px 10px 30px;">
                            <table border="0" cellpadding="0" cellspacing="0" style="margin: 0 auto;">
                                <tr>
                                    <td align="center" valign="middle" width="72" height="72" style="background-color: #ecfdf5; border-radius: 50%; text-align: center; font-size: 32px; line-height: 72px; width: 72px; height: 72px;">
                                        ✉️
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Body Content -->
                    <tr>
                        <td align="center" style="padding: 10px 40px 30px 40px;">
                            <h1 style="font-size: 24px; font-weight: 700; margin: 0 0 16px 0; color: #111827; line-height: 1.3;">
                                Merhaba {{Name}},
                            </h1>
                            <p style="font-size: 16px; color: #4b5563; line-height: 1.6; margin: 0 0 32px 0;">
                                E-bültenimize abone olduğunuz için teşekkür ederiz. Aboneliğinizi tamamlamak ve en güncel içerikleri almaya başlamak için lütfen aşağıdaki butona tıklayın.
                            </p>
                            
                            <!-- Button Table -->
                            <table border="0" cellpadding="0" cellspacing="0" style="margin: 0 auto;">
                                <tr>
                                    <td align="center" style="border-radius: 10px; background-color: #10b981;">
                                        <a href="{{ConfirmUrl}}" target="_blank" style="font-size: 16px; font-weight: 600; color: #ffffff; text-decoration: none; padding: 14px 32px; border-radius: 10px; display: inline-block; background-color: #10b981; border: 1px solid #10b981;">
                                            Aboneliğimi Onayla
                                        </a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Footer Row -->
                    <tr>
                        <td align="center" style="padding: 24px 40px 32px 40px; background-color: #f9fafb; border-top: 1px solid #f3f4f6; font-size: 13px; color: #9ca3af; line-height: 1.5;">
                            Eğer bu isteği siz yapmadıysanız, bu e-postayı güvenle silebilirsiniz.
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
